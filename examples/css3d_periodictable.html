    <script type="importmap">

    <script type="module">
      import * as THREE from "three";
      import TWEEN from "three/addons/libs/tween.module.js";
      import { TrackballControls } from "three/addons/controls/TrackballControls.js";
      import { CSS3DRenderer, CSS3DObject } from "three/addons/renderers/CSS3DRenderer.js";

      const SHEETS_ID = "12fI7ZkdxV0QVYsvqgCqcktv0tquyfnf9RBUqxZEvkBI";
      const API_KEY = "AIzaSyCiOZGobh_Cz1G-QEIpy8_HzkRn67MZrjs";
      const SHEET_DATA_URL = `https://docs.google.com/spreadsheets/d/${SHEETS_ID}/gviz/tq?tqx=out:csv&key=${API_KEY}&gid=1122872720`;

      let camera, scene, renderer, controls;
      let dataObjects = [];
      const objects = [];
      const targets = { table: [], sphere: [], helix: [], grid: [] };

      async function fetchDataAndInitialize() {
        console.log("📄 Fetching data from Google Sheet...");
        try {
          const response = await fetch(SHEET_DATA_URL);
          if (!response.ok) throw new Error("HTTP error " + response.status);

          const csvText = await response.text();
          dataObjects = csvText
            .split("\n")
            .slice(1)
            .map((r) => {
              const c = r.replace(/"/g, "").split(",");
              return {
                name: c[0]?.trim() || "N/A",
                netWorth: parseFloat(c[1]) || 0,
              };
            })
            .filter((o) => o.name !== "N/A");

          console.log("✅ Loaded", dataObjects.length, "records");
          startVisualization();
        } catch (err) {
          console.error("❌ Failed to load data:", err);
          document.getElementById("info").innerHTML = "<p style='color:red;'>Failed to load data.</p>";
        }
      }
      window.fetchDataAndInitialize = fetchDataAndInitialize;

      function startVisualization() {
        init();
        animate();
      }
      window.startVisualization = startVisualization;

      function init() {
        camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
        camera.position.z = 3000;

        scene = new THREE.Scene();
        objects.length = 0;

        for (let i = 0; i < dataObjects.length; i++) {
          const item = dataObjects[i];
          const element = document.createElement("div");
          element.className = "element";
          element.classList.add(getColorClass(item.netWorth));

          const number = document.createElement("div");
          number.className = "number";
          number.textContent = i + 1;
          element.appendChild(number);

          const symbol = document.createElement("div");
          symbol.className = "symbol";
          symbol.textContent = item.name.substring(0, 2).toUpperCase();
          element.appendChild(symbol);

          const details = document.createElement("div");
          details.className = "details";
          details.innerHTML = `${item.name}<br>$${(item.netWorth / 1000).toFixed(1)}K`;
          element.appendChild(details);

          const objCSS = new CSS3DObject(element);
          objCSS.position.x = Math.random() * 4000 - 2000;
          objCSS.position.y = Math.random() * 4000 - 2000;
          objCSS.position.z = Math.random() * 4000 - 2000;
          scene.add(objCSS);
          objects.push(objCSS);

          const obj3D = new THREE.Object3D();
          obj3D.position.x = (i % 20) * 140 - 1330;
          obj3D.position.y = -Math.floor(i / 20) * 180 + 990;
          targets.table.push(obj3D);
        }

        renderer = new CSS3DRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById("container").appendChild(renderer.domElement);

        controls = new TrackballControls(camera, renderer.domElement);
        controls.minDistance = 500;
        controls.maxDistance = 6000;
        controls.addEventListener("change", render);

        document.getElementById("table").addEventListener("click", () => transform(targets.table, 2000));
        document.getElementById("sphere").addEventListener("click", () => transform(targets.sphere, 2000));
        document.getElementById("helix").addEventListener("click", () => transform(targets.helix, 2000));
        document.getElementById("grid").addEventListener("click", () => transform(targets.grid, 2000));

        transform(targets.table, 2000);
        window.addEventListener("resize", onWindowResize);
      }

      function getColorClass(netWorth) {
        if (netWorth < 100000) return "networth-red";
        else if (netWorth > 200000) return "networth-green";
        else return "networth-orange";
      }

      function transform(targets, duration) {
        TWEEN.removeAll();
        for (let i = 0; i < objects.length; i++) {
          const object = objects[i];
          const target = targets[i];
          new TWEEN.Tween(object.position)
            .to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
            .easing(TWEEN.Easing.Exponential.InOut)
            .start();
        }
        new TWEEN.Tween(this).to({}, duration * 2).onUpdate(render).start();
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        render();
      }

      function animate() {
        requestAnimationFrame(animate);
        TWEEN.update();
        controls.update();
        render();
      }

      function render() {
        renderer.render(scene, camera);
      }
    </script>
  </body>
