<!DOCTYPE html>
<html>
<head>
    <title>3D People Table | muhdislm</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Helvetica, sans-serif;
            background-color: #000;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: rgba(127, 255, 255, 0.75);
            font-size: 14px;
        }

        #info a {
            color: #8ff;
            text-decoration: none;
        }

        /* Google Login Area */
        #google-login-area {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
            z-index: 9999;
        }

        #google-login-area h2 {
            color: rgba(127, 255, 255, 0.75);
            margin-bottom: 20px;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(127, 255, 255, 0.75);
            font-size: 24px;
            z-index: 1000;
            display: none;
        }

        #menu {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }

        /* Visualization Area - Hidden by default */
        #visualization-area {
            display: none;
        }

        .element {
            width: 140px;
            height: 200px;
            box-shadow: 0px 0px 12px rgba(0, 255, 255, 0.5);
            border: 1px solid rgba(127, 255, 255, 0.25);
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 10px;
            box-sizing: border-box;
        }

        .element:hover {
            box-shadow: 0px 0px 16px rgba(0, 255, 255, 0.95);
            border: 1px solid rgba(127, 255, 255, 0.95);
        }

        .element .image {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 8px;
            background-size: cover;
            background-position: center;
            border: 2px solid rgba(127, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .element .name {
            font-size: 13px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.95);
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
            margin-bottom: 6px;
            line-height: 1.2;
            flex-shrink: 0;
        }

        .element .details {
            font-size: 10px;
            color: rgba(127, 255, 255, 0.85);
            margin-bottom: 8px;
            line-height: 1.4;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .element .networth {
            font-size: 13px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.9);
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        button {
            color: rgba(127, 255, 255, 0.75);
            background: transparent;
            outline: 1px solid rgba(127, 255, 255, 0.75);
            border: 0px;
            padding: 8px 16px;
            cursor: pointer;
            margin: 0 5px;
            font-size: 14px;
        }

        button:hover {
            background-color: rgba(0, 255, 255, 0.5);
        }

        button:active {
            color: #000000;
            background-color: rgba(0, 255, 255, 0.75);
        }
    </style>

    <!-- JWT Decoder -->
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3.1.2/build/jwt-decode.min.js"></script>
</head>
<body>
    <!-- Google Login Area -->
    <div id="google-login-area">
        <h2>Please Sign In to View the Visualization</h2>

        <div id="g_id_onload" 
            data-client_id="1037845695081-o0krjrtiteb8a98evmqur7bfecll6agc.apps.googleusercontent.com"
            data-context="signin" 
            data-ux_mode="popup" 
            data-callback="handleCredentialResponse"
            data-auto_prompt="false">
        </div>

        <div class="g_id_signin" 
            data-type="standard" 
            data-shape="rectangular" 
            data-theme="outline"
            data-text="signin_with" 
            data-size="large" 
            data-logo_alignment="left">
        </div>
    </div>

    <!-- Visualization Area - Hidden until login -->
    <div id="visualization-area">
        <div id="loading">Loading data...</div>
        <div id="info">3D People Data Visualization</div>
        <div id="container"></div>
        <div id="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
        </div>
    </div>

    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script>
        // Global function for Google Sign-In callback
        window.handleCredentialResponse = function(response) {
            const id_token = response.credential;
            const user = jwt_decode(id_token);
            console.log("User signed in as:", user.email);

            // Hide login, show visualization
            document.getElementById('google-login-area').style.display = 'none';
            document.getElementById('visualization-area').style.display = 'block';

            // Start the visualization
            if (window.startVisualization) {
                window.startVisualization();
            }
        };
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <script>
        let camera, scene, renderer, controls;
        const objects = [];
        const targets = { table: [], sphere: [], helix: [], grid: [] };

        // Google Sheet CSV URL
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/12fI7ZkdxV0QVYsvqgCqcktv0tquyfnf9RBUqxZEvkBI/pub?output=csv';

        // Fetch and parse data
        async function fetchData() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                return new Promise((resolve, reject) => {
                    Papa.parse(csvText, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            console.log('Data loaded:', results.data.length, 'records');
                            resolve(results.data);
                        },
                        error: function(error) {
                            reject(error);
                        }
                    });
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                return [];
            }
        }

        // Get background color based on net worth
        function getBackgroundColor(netWorth) {
            const value = parseFloat(String(netWorth).replace(/[^0-9.-]/g, ''));
            
            if (isNaN(value) || value < 100000) {
                return 'rgba(220, 50, 50, 0.7)';
            } else if (value < 200000) {
                return 'rgba(255, 140, 0, 0.7)';
            } else {
                return 'rgba(50, 200, 50, 0.7)';
            }
        }

        // Format net worth for display
        function formatNetWorth(netWorth) {
            const value = parseFloat(String(netWorth).replace(/[^0-9.-]/g, ''));
            if (isNaN(value)) return '$0';
            
            if (value >= 1000000) {
                return '$' + (value / 1000000).toFixed(1) + 'M';
            } else if (value >= 1000) {
                return '$' + (value / 1000).toFixed(0) + 'K';
            } else {
                return '$' + value.toFixed(0);
            }
        }

        async function init() {
            document.getElementById('loading').style.display = 'block';
            
            const data = await fetchData();
            document.getElementById('loading').style.display = 'none';

            if (data.length === 0) {
                alert('No data found in the Google Sheet');
                return;
            }

            camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
            camera.position.z = 3000;

            scene = new THREE.Scene();

            data.forEach((person, index) => {
                if (index === 0) {
                    console.log('Column names:', Object.keys(person));
                }

                const element = document.createElement('div');
                element.className = 'element';
                element.style.backgroundColor = getBackgroundColor(person['Net Worth'] || '0');

                const imageDiv = document.createElement('div');
                imageDiv.className = 'image';
                const photoUrl = person.Photo || person.photo;
                if (photoUrl && photoUrl.trim()) {
                    imageDiv.style.backgroundImage = `url(${photoUrl.trim()})`;
                } else {
                    imageDiv.style.backgroundColor = 'rgba(127, 255, 255, 0.3)';
                }
                element.appendChild(imageDiv);

                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = person.Name || 'Unknown';
                element.appendChild(name);

                const details = document.createElement('div');
                details.className = 'details';
                const detailsText = [];
                
                if (person.Age) detailsText.push(`Age: ${person.Age}`);
                if (person.Country) detailsText.push(person.Country);
                if (person.Interest) detailsText.push(person.Interest);
                
                details.innerHTML = detailsText.length > 0 ? detailsText.join('<br>') : '&nbsp;';
                element.appendChild(details);

                const networth = document.createElement('div');
                networth.className = 'networth';
                networth.textContent = formatNetWorth(person['Net Worth'] || '0');
                element.appendChild(networth);

                const objectCSS = new THREE.CSS3DObject(element);
                objectCSS.position.x = Math.random() * 4000 - 2000;
                objectCSS.position.y = Math.random() * 4000 - 2000;
                objectCSS.position.z = Math.random() * 4000 - 2000;
                scene.add(objectCSS);
                objects.push(objectCSS);
            });

            createTableLayout();
            createSphereLayout();
            createHelixLayout();
            createGridLayout();

            renderer = new THREE.CSS3DRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);

            controls = new THREE.TrackballControls(camera, renderer.domElement);
            controls.minDistance = 500;
            controls.maxDistance = 6000;
            controls.addEventListener('change', render);

            document.getElementById('table').addEventListener('click', () => {
                transform(targets.table, 2000);
            });

            document.getElementById('sphere').addEventListener('click', () => {
                transform(targets.sphere, 2000);
            });

            document.getElementById('helix').addEventListener('click', () => {
                transform(targets.helix, 2000);
            });

            document.getElementById('grid').addEventListener('click', () => {
                transform(targets.grid, 2000);
            });

            transform(targets.table, 2000);

            window.addEventListener('resize', onWindowResize);
        }

        function createTableLayout() {
            const cols = 20;
            const rows = 10;
            const spacingX = 180;
            const spacingY = 240;

            for (let i = 0; i < objects.length; i++) {
                const object = new THREE.Object3D();
                const col = i % cols;
                const row = Math.floor(i / cols);
                
                object.position.x = (col * spacingX) - (cols * spacingX / 2);
                object.position.y = -(row * spacingY) + (rows * spacingY / 2);
                object.position.z = 0;
                
                targets.table.push(object);
            }
        }

        function createSphereLayout() {
            const vector = new THREE.Vector3();
            for (let i = 0; i < objects.length; i++) {
                const phi = Math.acos(-1 + (2 * i) / objects.length);
                const theta = Math.sqrt(objects.length * Math.PI) * phi;
                const object = new THREE.Object3D();

                object.position.setFromSphericalCoords(900, phi, theta);
                vector.copy(object.position).multiplyScalar(2);
                object.lookAt(vector);
                
                targets.sphere.push(object);
            }
        }

        function createHelixLayout() {
            const vector = new THREE.Vector3();
            const halfLength = Math.floor(objects.length / 2);

            for (let i = 0; i < objects.length; i++) {
                const object = new THREE.Object3D();
                const isFirstHelix = i < halfLength;
                const index = isFirstHelix ? i : i - halfLength;
                
                const theta = index * 0.35 + (isFirstHelix ? 0 : Math.PI);
                const y = -(index * 16) + 900;
                const radius = 600;

                object.position.setFromCylindricalCoords(radius, theta, y);
                
                vector.x = object.position.x * 2;
                vector.y = object.position.y;
                vector.z = object.position.z * 2;
                object.lookAt(vector);
                
                targets.helix.push(object);
            }
        }

        function createGridLayout() {
            const cols = 5;
            const rows = 4;
            const layers = 10;
            const spacingX = 400;
            const spacingY = 400;
            const spacingZ = 1000;

            for (let i = 0; i < objects.length; i++) {
                const object = new THREE.Object3D();
                const layer = Math.floor(i / (cols * rows));
                const indexInLayer = i % (cols * rows);
                const col = indexInLayer % cols;
                const row = Math.floor(indexInLayer / cols);

                object.position.x = (col * spacingX) - (cols * spacingX / 2);
                object.position.y = -(row * spacingY) + (rows * spacingY / 2);
                object.position.z = (layer * spacingZ) - (layers * spacingZ / 2);
                
                targets.grid.push(object);
            }
        }

        function transform(targets, duration) {
            TWEEN.removeAll();

            for (let i = 0; i < objects.length; i++) {
                const object = objects[i];
                const target = targets[i];

                new TWEEN.Tween(object.position)
                    .to({
                        x: target.position.x,
                        y: target.position.y,
                        z: target.position.z
                    }, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();

                new TWEEN.Tween(object.rotation)
                    .to({
                        x: target.rotation.x,
                        y: target.rotation.y,
                        z: target.rotation.z
                    }, Math.random() * duration + duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
            }

            new TWEEN.Tween({})
                .to({}, duration * 2)
                .onUpdate(render)
                .start();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            render();
        }

        function animate() {
            requestAnimationFrame(animate);
            TWEEN.update();
            controls.update();
        }

        function render() {
            renderer.render(scene, camera);
        }

        window.startVisualization = function() {
            init().then(() => {
                animate();
            });
        };
    </script>
</body>
</html>
